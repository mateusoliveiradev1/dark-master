<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e23b3b"/>
      <stop offset="1" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>
  <g stroke="#F5F5F4" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <path class="draw" d="M8 18 L8 52 L56 52 L56 18 L32 18 L27 12 L8 12 Z" fill="#111114"/>
    <path class="draw" d="M8 26 L56 26" stroke="#26262c"/>
  </g>
  <circle class="lens" cx="38" cy="36" r="8" stroke="url(#g)" stroke-width="2.6"/>
  <path class="lens" d="M44 42 L50 48" stroke="url(#g)" stroke-width="3.2" stroke-linecap="round"/>
  <rect class="stamp" x="14" y="31" width="12" height="3.4" rx="1.2" fill="#e23b3b"/>
  <style>
    .draw{stroke-dasharray:220;stroke-dashoffset:220;animation:draw 1.1s ease forwards}
    .lens{opacity:0;animation:fade .6s ease .7s forwards}
    .stamp{opacity:0;transform-origin:20px 33px;animation:stamp .5s cubic-bezier(.2,1.4,.4,1) 1s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes fade{to{opacity:1}}
    @keyframes stamp{0%{opacity:0;transform:scale(1.6) rotate(-8deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
    @media(prefers-reduced-motion:reduce){.draw,.lens,.stamp{animation:none;stroke-dashoffset:0;opacity:1}}
  </style>
</svg>
