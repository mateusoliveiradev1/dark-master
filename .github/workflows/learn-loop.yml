name: learn-loop

on:
  schedule:
    # Diário 06:00 UTC: coleta + análise (custo baixo, ~350 un)
    - cron: "0 6 * * *"
    # Domingo 07:00 UTC: + watch + revalidação (custo alto, com teto de quota)
    - cron: "0 7 * * 0"
    # Domingo 08:00 UTC: pesquisa automática sem chave + painel
    - cron: "0 8 * * 0"
  workflow_dispatch:
    inputs:
      full:
        description: "Incluir watch + revalidate (domingo)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-api-python-client google-auth google-auth-oauthlib pytrends psycopg2-binary
      - name: Restaurar segredos OAuth
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          GOOGLE_CLIENT_SECRETS: ${{ secrets.GOOGLE_CLIENT_SECRETS }}
        run: |
          mkdir -p ~/.config/opencode/secrets
          printf '%s' "$YT_TOKEN_JSON" > ~/.config/opencode/secrets/yt-token.json
          printf '%s' "$GOOGLE_CLIENT_SECRETS" > ~/.config/opencode/secrets/client_secrets.json
      - name: Loop diário (coleta + análise)
        if: github.event.schedule == '0 6 * * *' || (github.event_name == 'workflow_dispatch' && inputs.full != 'true')
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/learn_loop.py --collect --analyze --no-dashboard
      - name: Loop semanal (tudo, com teto de quota)
        if: github.event.schedule == '0 7 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.full == 'true')
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/learn_loop.py --all --quota-budget 8000 --no-dashboard
      - name: Publicar relatório do dia
        uses: actions/upload-artifact@v4
        with:
          name: learn-loop-report
          path: data/learn_loop/*.json
      - name: Commitar JSONs do painel
        run: |
          git config user.name "dark-master-loop"
          git config user.email "dark-master-loop@users.noreply.github.com"
          git add -A data/
          git diff --quiet --cached || git commit -m "data: loop diario $(date -u +%F)"
          git pull --rebase origin master
          git push

  research:
    runs-on: ubuntu-latest
    # Domingo 08:00 UTC: pesquisa automática (sem chave) + painel + commit-back
    if: github.event.schedule == '0 8 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.full == 'true')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytrends
      - name: Pesquisa automática EN+PT
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/auto_research.py --lang en
          python scripts/auto_research.py --lang pt
          python scripts/learn_loop.py --dashboard
      - name: Commitar pesquisa + painel
        run: |
          git config user.name "dark-master-loop"
          git config user.email "dark-master-loop@users.noreply.github.com"
          git add -A data/
          git diff --quiet --cached || git commit -m "data: pesquisa semanal $(date -u +%F)"
          git pull --rebase origin master
          git push
